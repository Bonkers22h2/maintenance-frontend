<div class="page-header">
    <h1>Facility details</h1>
</div>

<div class="detail-panel" *ngIf="facility$ | async as facility">
    <h2>{{ facility.name }}</h2>
    <div *ngIf="!isEditing">
        <dl class="detail-list">
            <dt>ID</dt>
            <dd>{{ facility.id }}</dd>
            <dt>Facility type</dt>
            <dd>{{ facility.facilityType }}</dd>
            <dt>Location</dt>
            <dd>{{ facility.location }}</dd>
        </dl>
        <div class="page-actions">
            <button *ngIf="userRole === 'ADMIN'" (click)="startEdit(facility)">Edit</button>
            <button *ngIf="userRole === 'ADMIN'" (click)="deleteFacilty()">Delete</button>
        </div>
    </div>

    <div class="facility-edit-form" *ngIf="isEditing">
        <label>
            Name
            <input [(ngModel)]="editName" name="editName">
        </label>
        <label>
            Location
            <input [(ngModel)]="editLocation" name="location">
        </label>
        <label>
            Facility type
            <select [(ngModel)]="editFacilityType" name="facilityType">
                <option value="ROOM">Room</option>
                <option value="COMMON_AREA">Common Area</option>
                <option value="UTILITY">Utility</option>
            </select>
        </label>
        <div class="page-actions">
            <button (click)="saveEdit()">Save</button>
            <button class="button-secondary" (click)="isEditing = false">Cancel</button>
        </div>
    </div>
</div>
