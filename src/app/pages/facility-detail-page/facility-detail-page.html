<div class="page-header">
    <h1>Facility details</h1>
</div>

<div class="detail-panel" *ngIf="facility$ | async as facility">
    <h2>{{ facility.name }}</h2>
    <dl class="detail-list">
        <dt>ID</dt><dd>{{ facility.id }}</dd>
        <dt>Facility type</dt><dd>{{ facility.facilityType }}</dd>
        <dt>Location</dt><dd>{{ facility.location }}</dd>
    </dl>
</div>
