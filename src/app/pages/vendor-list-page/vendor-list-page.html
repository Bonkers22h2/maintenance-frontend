<div class="page-header">
    <div>
        <h1>Vendors</h1>
        <p>Browse and manage maintenance service providers.</p>
    </div>
    <a class="button" *ngIf="userRole === 'ADMIN'" routerLink="/vendors/new">New vendor</a>
</div>

<ng-container *ngIf="vendors$ | async as vendors">
    <div class="content-grid">
        <div *ngFor="let vendor of vendors">
            <a class="card" [routerLink]="['/vendors', vendor.id]">
                <h3>{{ vendor.name }}</h3>
                <p><strong>Specialty:</strong> {{ vendor.specialty }}</p>
                <p><strong>Contact:</strong> {{ vendor.contactNumber }}</p>
                <p><strong>Email:</strong> {{ vendor.email }}</p>
            </a>
        </div>
    </div>
</ng-container>
