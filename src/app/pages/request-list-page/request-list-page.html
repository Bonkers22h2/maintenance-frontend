<p *ngIf="maintenanceRequests$ | async as requests">
  {{ requests.length }}
</p>

<div *ngFor="let request of (maintenanceRequests$ | async)">
  <a [routerLink]="['/requests', request.id]">
    <app-request-card [title]="request.title" [status]="request.status"
      [priority]="request.priority"></app-request-card>
  </a>

</div>


<a routerLink="/requests/new">+ New Request</a>
<a [routerLink]="['/facilities']">Facilities</a>
