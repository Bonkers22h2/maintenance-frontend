<ng-container *ngIf="facilities$ | async as page">  
    <div *ngFor="let facility of (facilities$ | async)">
        <a [routerLink]="['/facilities', facility.id]">
            <app-facility-card [name]="facility.name" [location]="facility.location"
                [facilityType]="facility.facilityType">
            </app-facility-card>
        </a>
    </div>
</ng-container>
