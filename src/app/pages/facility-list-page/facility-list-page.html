<ng-container *ngIf="facilities$ | async as facilities">
    <div *ngFor="let facility of facilities">
        <a [routerLink]="['/facilities', facility.id]">
            <app-facility-card [name]="facility.name" [location]="facility.location"
                [facilityType]="facility.facilityType">
            </app-facility-card>
        </a>
    </div>
</ng-container>

<a routerLink="/facilities/new">+ New Facilities</a>
